# Baut die Seite bei jedem Commit auf main und veröffentlicht sie über GitHub Pages.
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Seite bauen
        run: python3 build.py

      - name: Eingabemaske und Ausgangsstand nicht veroeffentlichen
        run: rm -rf site/admin site/_inhalte.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
